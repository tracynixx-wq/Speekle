name: Speekly checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Validate PWA manifest
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest', 'utf8'))"
      - name: Check required PWA files
        run: |
          test -f index.html
          test -f style.css
          test -f config.js
          test -f app.js
          test -f sw.js
          test -f manifest.webmanifest
