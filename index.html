<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="Speekly — messenger">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css">
  <title>Speekly</title>
</head>
<body>
  <main id="app">
    <section id="auth-view" class="panel">
      <h1>Speekly</h1>
      <form id="auth-form">
        <label>Email<input id="email" type="email" autocomplete="email" required></label>
        <label>Пароль<input id="password" type="password" minlength="6" autocomplete="current-password" required></label>
        <div class="actions">
          <button type="submit" id="login-button">Войти</button>
          <button type="button" id="signup-button" class="secondary">Регистрация</button>
        </div>
      </form>
      <p id="auth-status" role="status"></p>
    </section>

    <section id="profile-view" class="panel" hidden>
      <h1>Создай профиль</h1>
      <p>Как тебя будут видеть другие пользователи Speekly?</p>
      <form id="profile-form">
        <label>Имя<input id="display-name" maxlength="40" placeholder="Например, Алексей" required></label>
        <label>Юзернейм<input id="username" minlength="3" maxlength="24" pattern="[A-Za-z0-9_]+" autocomplete="username" placeholder="например, alex_01" required></label>
        <p class="hint">От 3 до 24 символов: латинские буквы, цифры и _</p>
        <button type="submit">Сохранить профиль</button>
      </form>
      <p id="profile-status" role="status"></p>
    </section>

    <section id="chat-view" hidden>
      <header>
        <strong>Speekly</strong>
        <span id="account-label"></span>
        <button id="logout-button" class="secondary">Выйти</button>
      </header>
      <div class="workspace">
        <aside>
          <form id="new-chat-form">
            <label>Найти пользователя<input id="peer-username" placeholder="@username" maxlength="24" required></label>
            <button type="submit">Найти</button>
          </form>
          <div id="user-result" aria-live="polite"></div>
          <h2>Чаты</h2>
          <ul id="chat-list"></ul>
        </aside>
        <section class="messages-panel">
          <div id="empty-state">Выберите чат или найдите пользователя.</div>
          <div id="conversation" hidden>
            <h2 id="conversation-title">Диалог</h2>
            <ol id="messages"></ol>
            <form id="message-form">
              <input id="message-input" maxlength="4000" placeholder="Сообщение…" autocomplete="off" required>
              <button type="submit">Отправить</button>
            </form>
          </div>
        </section>
      </div>
      <p id="app-status" role="status"></p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
