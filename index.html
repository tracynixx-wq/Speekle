<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css">
  <title>Speekly</title>
</head>
<body>
  <main id="app">
    <section id="auth-view" class="auth-screen">
      <div class="auth-card">
        <div class="brand-mark">S</div>
        <h1>Speekly</h1>
        <p class="muted">Сообщения рядом</p>
        <form id="auth-form">
          <label>Email<input id="email" type="email" autocomplete="email" required placeholder="name@example.com"></label>
          <label>Пароль<input id="password" type="password" minlength="6" autocomplete="current-password" required placeholder="Пароль"></label>
          <div class="auth-actions">
            <button type="submit" id="login-button">Войти</button>
            <button type="button" id="signup-button" class="button-muted">Регистрация</button>
          </div>
        </form>
        <p id="auth-status" class="status" role="status"></p>
      </div>
    </section>

    <section id="profile-view" class="onboarding" hidden>
      <div class="brand-mark">S</div>
      <h1>Создать профиль</h1>
      <p class="muted">Добавь имя и юзернейм, чтобы тебя могли найти.</p>
      <form id="profile-form" class="form-card">
        <label>Имя<input id="display-name" maxlength="40" placeholder="Твоё имя" required></label>
        <label>Юзернейм<input id="username" minlength="3" maxlength="24" pattern="[A-Za-z0-9_]+" placeholder="username" required></label>
        <p class="hint">3–24 символа: латинские буквы, цифры и подчёркивание.</p>
        <button type="submit">Сохранить профиль</button>
      </form>
      <p id="profile-status" class="status" role="status"></p>
    </section>

    <section id="main-view" hidden>
      <header class="topbar">
        <button id="top-left" class="top-text-button">Изм.</button>
        <div class="top-title"><span class="brand-mini">S</span><strong id="top-title">Чаты</strong></div>
        <div class="top-actions">
          <button id="search-toggle" class="circle-button" aria-label="Поиск">⌕</button>
          <button id="compose-button" class="compose-button" aria-label="Новое сообщение">↗</button>
        </div>
      </header>

      <div id="search-panel" class="search-panel" hidden>
        <input id="global-search" placeholder="Поиск по чатам и контактам">
      </div>

      <section id="chats-page" class="page">
        <div id="chat-list" class="chat-list"></div>
        <div id="chats-empty" class="empty-state" hidden>Пока нет чатов. Нажми на кнопку нового сообщения.</div>
      </section>

      <section id="contacts-page" class="page" hidden>
        <div class="section-heading">Контакты <span id="contact-count"></span></div>
        <div class="search-line"><input id="contact-search" placeholder="Найти по имени или @username"></div>
        <div id="contact-list" class="contact-list"></div>
      </section>

      <section id="settings-page" class="page" hidden>
        <div class="profile-hero">
          <div id="profile-avatar" class="profile-avatar">S</div>
          <h1 id="profile-name">Имя</h1>
          <p id="profile-handle">@username</p>
        </div>
        <div class="settings-group profile-edit-group">
          <button class="setting-row blue-row" id="choose-avatar-button"><span class="setting-icon camera-icon">◎</span><span>Выбрать фотографию</span><span class="chevron">›</span></button>
          <button class="setting-row blue-row" id="edit-profile-button"><span class="setting-icon user-icon">＠</span><span>Изменить имя и юзернейм</span><span class="chevron">›</span></button>
          <div class="setting-row"><span class="setting-icon user-icon">＠</span><span id="settings-username">@username</span></div>
        </div>
        <div class="settings-group">
          <button class="setting-row" data-setting="Избранное"><span class="setting-icon bookmark-icon">▮</span><span>Избранное</span><span class="chevron">›</span></button>
          <button class="setting-row" data-setting="Недавние звонки"><span class="setting-icon phone-icon">☎</span><span>Недавние звонки</span><span class="chevron">›</span></button>
          <button class="setting-row" data-setting="Устройства"><span class="setting-icon device-icon">▣</span><span>Устройства</span><span class="chevron">›</span></button>
          <button class="setting-row" data-setting="Папки с чатами"><span class="setting-icon folder-icon">▰</span><span>Папки с чатами</span><span class="chevron">›</span></button>
        </div>
        <div class="settings-group">
          <button class="setting-row" data-setting="Уведомления и звуки"><span class="setting-icon bell-icon">♟</span><span>Уведомления и звуки</span><span class="chevron">›</span></button>
          <button class="setting-row" data-setting="Конфиденциальность"><span class="setting-icon lock-icon">▣</span><span>Конфиденциальность</span><span class="chevron">›</span></button>
          <button class="setting-row" data-setting="Данные и память"><span class="setting-icon data-icon">▤</span><span>Данные и память</span><span class="chevron">›</span></button>
          <button class="setting-row" data-setting="Оформление"><span class="setting-icon theme-icon">◐</span><span>Оформление</span><span class="chevron">›</span></button>
          <button class="setting-row" data-setting="Энергосбережение"><span class="setting-icon battery-icon">▱</span><span>Энергосбережение</span><span class="chevron">›</span></button>
          <button class="setting-row" data-setting="Язык"><span class="setting-icon language-icon">◎</span><span>Язык</span><span class="setting-value">Русский</span><span class="chevron">›</span></button>
        </div>
        <div class="settings-group">
          <button class="setting-row" id="logout-button"><span class="setting-icon logout-icon">↪</span><span>Выйти из аккаунта</span><span class="chevron">›</span></button>
        </div>
      </section>

      <section id="conversation-page" class="conversation-page" hidden>
        <header class="conversation-header">
          <button id="back-to-chats" class="back-button">‹</button>
          <div id="conversation-avatar" class="chat-avatar small-avatar">S</div>
          <div class="conversation-heading"><strong id="conversation-title">Чат</strong><span id="conversation-subtitle">был(а) недавно</span></div>
          <button id="conversation-more" class="circle-button" aria-label="Информация">⋯</button>
        </header>
        <div id="messages" class="messages"></div>
        <form id="message-form" class="message-composer">
          <input id="message-input" maxlength="4000" placeholder="Сообщение" autocomplete="off" required>
          <button type="submit" aria-label="Отправить">➤</button>
        </form>
      </section>

      <nav id="bottom-nav" class="bottom-nav">
        <button class="nav-button" data-page="contacts"><span class="nav-symbol">●</span><span>Контакты</span></button>
        <button class="nav-button active" data-page="chats"><span class="nav-symbol">●●</span><span>Чаты</span><i id="unread-badge" hidden>2</i></button>
        <button class="nav-button" data-page="settings"><span class="nav-symbol">●</span><span>Настройки</span></button>
      </nav>
      <input id="avatar-file" type="file" accept="image/png,image/jpeg,image/webp" hidden>
      <p id="app-status" class="app-status" role="status"></p>
    </section>

    <dialog id="edit-profile-dialog" class="edit-dialog">
      <form id="edit-profile-form" method="dialog">
        <div class="dialog-head"><strong>Мой профиль</strong><button type="button" id="close-profile-dialog">✕</button></div>
        <label>Имя<input id="edit-display-name" maxlength="40" required></label>
        <label>Юзернейм<input id="edit-username" minlength="3" maxlength="24" required></label>
        <p id="edit-profile-status" class="status"></p>
        <button type="submit">Сохранить</button>
      </form>
    </dialog>

    <dialog id="new-chat-dialog" class="edit-dialog">
      <form id="new-chat-form" method="dialog">
        <div class="dialog-head"><strong>Новое сообщение</strong><button type="button" id="close-new-chat">✕</button></div>
        <label>Найти пользователя<input id="peer-username" placeholder="@username" maxlength="24" required></label>
        <button type="submit">Найти</button>
        <div id="user-result" class="user-result"></div>
      </form>
    </dialog>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
